[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lugunavoice"
version = "0.1.0"
description = "LugunaVoice developer SDK — text-to-speech with async generation and polling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["lugunavoice*"]
